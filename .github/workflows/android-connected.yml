name: Build connected CheckSquare APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-connected.yml'
      - 'apps/web/src/**'
      - 'apps/web/package.json'
      - 'package-lock.json'
      - 'apps/web/capacitor.config.json'
      - 'scripts/prepare-android.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build connected app
        run: npm run build
        env:
          # Publishable key is intentionally public; no privileged key is used.
          VITE_SUPABASE_URL: https://jcnvcyocatcovtdedokf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_p3Xm4a8y2kX3pS3fGUU9PA_f6T-FDFw
      - name: Keep the connected debug app separate from existing installs
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='apps/web/capacitor.config.json';
          const config=JSON.parse(fs.readFileSync(path));
          config.appName='CheckSquare Connected';
          fs.writeFileSync(path,JSON.stringify(config,null,2));
          JS
      - run: node scripts/prepare-android.mjs
      - name: Verify native Google OAuth callback registration
        run: grep -q 'android:scheme="com.bhupathi.checksquare.connected"' apps/web/android/app/src/main/AndroidManifest.xml
      - name: Separate Android installation ID
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          file=Path('apps/web/android/app/build.gradle')
          source=file.read_text().replace('applicationId "com.bhupathi.checksquare"', 'applicationId "com.bhupathi.checksquare.connected"')
          source=source.replace('versionCode 1', 'versionCode 5').replace('versionName "1.0"', 'versionName "1.4"')
          file.write_text(source)
          if 'versionCode 5' not in source or 'versionName "1.4"' not in source:
              raise SystemExit('Could not set connected APK version 1.4 (version code 5).')
          PYCODE
      - run: node apps/web/scripts/make-icon.mjs
      - run: cd apps/web && npx cap sync android
      - run: cd apps/web/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify and name installable APK
        id: package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PYCODE'
          import datetime
          import os
          import re
          import shutil
          from pathlib import Path
          gradle = Path('apps/web/android/app/build.gradle').read_text()
          version = re.search(r'versionName "([0-9.]+)"', gradle).group(1)
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          name = f'CheckSquare-Connected-v{version}-debug-{date}'
          artifact = Path('artifacts') / f'{name}.apk'
          artifact.parent.mkdir(exist_ok=True)
          shutil.copyfile('apps/web/android/app/build/outputs/apk/debug/app-debug.apk', artifact)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\npath={artifact}\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
