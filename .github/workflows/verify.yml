name: Verify CheckSquare
on:
  push:
    branches: [main, 'checksquare/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: node scripts/test-docx.mjs
      - name: Production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency report
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: checksquare-web-${{ github.sha }}
          path: dist/apps/web
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: checksquare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Schema, RLS, lifecycle and migration repeatability
        env:
          TEST_DATABASE_URL: postgres://postgres:isolated-test-password@localhost:5432/checksquare_test
          CHECKSQUARE_DISPOSABLE_DB: '1'
        run: scripts/test-database.sh
